apiVersion: batch/v1
kind: Job
metadata:
  name: agentops-migration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: agentops-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: ghcr.io/jagseeun/agentops-platform:latest
          command:
            - uv
            - run
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: agentops-config
            - secretRef:
                name: agentops-secret